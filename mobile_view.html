<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FTA v6 Mobile Edge Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#070a12;--card:#0f1728;--card2:#111d31;--text:#eaf1ff;--muted:#91a3bf;--border:#263550;--good:#20d489;--bad:#ff5c7a;--warn:#ffd166;--blue:#7dd3fc;--purple:#a78bfa}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{width:100%;max-width:820px;margin:0 auto;padding:12px}.top{position:sticky;top:0;z-index:10;margin:-12px -12px 12px;padding:12px;background:rgba(7,10,18,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
    h1{margin:0 0 5px;font-size:20px;letter-spacing:-.03em}.sub,.status{color:var(--muted);font-size:12px;line-height:1.4}.status{margin-top:9px;padding:9px 10px;border:1px solid var(--border);border-radius:14px;background:#0b1220}
    .card,.signal{border:1px solid var(--border);background:var(--card);border-radius:18px;padding:12px;margin-bottom:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    input,select,button{width:100%;border:1px solid var(--border);border-radius:14px;padding:11px 12px;background:#0b1220;color:var(--text);font-size:14px}button{border:0;background:linear-gradient(135deg,#2862ff,#7c3cff);font-weight:800}button.secondary{background:#152238;border:1px solid var(--border)}
    label{display:block;color:var(--muted);font-size:12px;margin:8px 0 4px}.hide{display:none}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.tabs button{white-space:nowrap;font-size:12px;padding:10px;background:#152238;border:1px solid var(--border)}.tabs button.active{background:linear-gradient(135deg,#2862ff,#7c3cff);border:0}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.mini{border:1px solid var(--border);background:var(--card2);border-radius:16px;padding:10px}.mini span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.mini b{font-size:18px}
    .head{display:flex;justify-content:space-between;gap:10px}.symbol{font-size:18px;font-weight:900;color:var(--text);text-decoration:none}.id{display:block;color:var(--muted);font-size:10px;word-break:break-all;margin-top:4px}
    .tag{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:900;white-space:nowrap}.long{background:rgba(32,212,137,.16);color:var(--good);border:1px solid rgba(32,212,137,.42)}.short{background:rgba(255,92,122,.16);color:var(--bad);border:1px solid rgba(255,92,122,.42)}.trade{background:rgba(32,212,137,.16);color:var(--good);border:1px solid rgba(32,212,137,.42)}.forward{background:rgba(125,211,252,.14);color:var(--blue);border:1px solid rgba(125,211,252,.38)}.shadow{background:rgba(167,139,250,.16);color:var(--purple);border:1px solid rgba(167,139,250,.42)}.warn{background:rgba(255,209,102,.14);color:var(--warn);border:1px solid rgba(255,209,102,.38)}.bad{background:rgba(255,92,122,.15);color:var(--bad);border:1px solid rgba(255,92,122,.38)}
    .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.kv div{background:#0b1220;border:1px solid var(--border);border-radius:14px;padding:8px}.kv span{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}.kv b{font-size:13px}.notes{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.45}.empty{text-align:center;color:var(--muted);padding:18px}
    @media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>FTA v6 Mobile Edge Viewer</h1>
    <div class="sub">Viewer điện thoại cho Edge Lab: xem Shadow / Forward / Trade Ready, xác suất TP1/TP2, outcome và learning.</div>
    <div id="status" class="status">Sẵn sàng.</div>
  </div>
  <div class="card">
    <div class="row"><button id="settingsToggle" class="secondary">Cài đặt</button><button id="refreshBtn">Tải cloud</button></div>
    <div id="settings" class="hide">
      <label>Supabase URL</label><input id="supaUrl" placeholder="https://xxxx.supabase.co">
      <label>Anon key</label><input id="supaKey" placeholder="anon public key">
      <div class="row"><div><label>Email</label><input id="email"></div><div><label>Password</label><input id="password" type="password"></div></div>
      <div class="row" style="margin-top:8px"><button id="saveBtn" class="secondary">Lưu</button><button id="loginBtn">Login</button></div>
      <label>Hoặc import JSON export từ FTA v6</label><input id="jsonFile" type="file" accept="application/json,.json">
    </div>
  </div>
  <div class="grid">
    <div class="mini"><span>Total</span><b id="mTotal">0</b></div><div class="mini"><span>Trade / Forward</span><b id="mTF">0 / 0</b></div>
    <div class="mini"><span>TP2 / TP1</span><b id="mWin">0 / 0</b></div><div class="mini"><span>Loss / Weak</span><b id="mLoss">0 / 0</b></div>
  </div>
  <div class="card">
    <div class="tabs" id="tabs">
      <button data-tab="trade" class="active">Trade Ready</button><button data-tab="forward">Forward</button><button data-tab="shadow">Shadow</button><button data-tab="active">Active</button><button data-tab="closed">Closed</button><button data-tab="all">All</button>
    </div>
    <div class="row" style="margin-top:10px"><select id="side"><option value="ALL">All side</option><option>LONG</option><option>SHORT</option></select><input id="search" placeholder="Tìm symbol"></div>
  </div>
  <div id="list"></div>
</div>
<script>
const $=id=>document.getElementById(id), CFG='fta_v6_mobile_cfg'; let client=null, session=null, signals=[], tab='trade';
function status(msg){$('status').textContent=msg} function fmt(n,d=4){return Number.isFinite(+n)?(+n).toLocaleString('en-US',{maximumFractionDigits:d}):'-'} function pct(n){return Number.isFinite(+n)?`${Math.round(+n)}%`:'-'} function dt(t){return t?new Date(t).toLocaleString('vi-VN'):'-'} function url(s){return `https://www.binance.com/en/futures/${s}`}
function isOpen(s){return ['WAIT_ENTRY','ENTRY_FILLED','TP1_HIT','NEW','OPEN'].includes(s.status)} function isTp2(s){return ['TP2_WIN','TP2_HIT','TP2_HIT_FULL_WIN'].includes(s.status)||['TP2_WIN','TP2_HIT','TP2_HIT_FULL_WIN'].includes(s.result)} function isTp1(s){return isTp2(s)||['TP1_ONLY','TP1_HIT','TP1_THEN_SL','EXPIRED_AFTER_TP1_NO_TP2'].includes(s.status)||['TP1_ONLY','TP1_HIT','TP1_THEN_SL','EXPIRED_AFTER_TP1_NO_TP2'].includes(s.result)} function isLoss(s){return s.status==='LOSS'||s.result==='LOSS'} function isWeak(s){return s.status==='EXPIRED_AFTER_ENTRY_NO_TP1'||s.result==='EXPIRED_AFTER_ENTRY_NO_TP1'} function closed(s){return !isOpen(s)}
function bucketClass(b){return b==='TRADE_READY'?'trade':b==='FORWARD_TEST'?'forward':b==='SHADOW_TEST'?'shadow':'warn'} function statusClass(s){if(isTp2(s)||isTp1(s))return 'trade'; if(isLoss(s))return 'bad'; if(isWeak(s)||String(s.status).includes('EXPIRED'))return 'warn'; return 'forward'}
function saveCfg(){localStorage.setItem(CFG,JSON.stringify({url:$('supaUrl').value.trim(),key:$('supaKey').value.trim(),email:$('email').value.trim()}));status('Đã lưu config.')} function loadCfg(){try{const c=JSON.parse(localStorage.getItem(CFG)||'{}');$('supaUrl').value=c.url||'';$('supaKey').value=c.key||'';$('email').value=c.email||''}catch{}}
function init(){const u=$('supaUrl').value.trim(), k=$('supaKey').value.trim(); if(!u||!k)throw new Error('Thiếu Supabase URL/key'); client=supabase.createClient(u,k); return client}
async function login(){saveCfg();init();const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}); if(error)throw error; session=data.session; status('Login thành công. Bấm Tải cloud.')}
async function loadCloud(){if(!client)init();const s=await client.auth.getSession();session=s.data.session;if(!session)throw new Error('Chưa login Supabase');const {data,error}=await client.from('signals').select('*').eq('user_id',session.user.id).order('signal_time',{ascending:false}).limit(1000); if(error)throw error; signals=(data||[]).map(r=>r.payload||r.data||r.signal||r).filter(Boolean);status(`Đã tải ${signals.length} signals.`);render()}
function importFile(f){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);signals=Array.isArray(d)?d:Array.isArray(d.signals)?d.signals:[];status(`Đã import ${signals.length} signals.`);render()}catch(e){status('Import lỗi: '+e.message)}};r.readAsText(f)}
function filtered(){const q=$('search').value.trim().toUpperCase(), side=$('side').value;return signals.filter(s=>{if(side!=='ALL'&&s.side!==side)return false;if(q&&!String(s.symbol||'').includes(q))return false;if(tab==='trade')return s.bucket==='TRADE_READY';if(tab==='forward')return s.bucket==='FORWARD_TEST';if(tab==='shadow')return s.bucket==='SHADOW_TEST';if(tab==='active')return isOpen(s);if(tab==='closed')return closed(s);return true}).sort((a,b)=>(b.signalTime||0)-(a.signalTime||0))}
function metrics(){$('mTotal').textContent=signals.length;$('mTF').textContent=`${signals.filter(s=>s.bucket==='TRADE_READY').length} / ${signals.filter(s=>s.bucket==='FORWARD_TEST').length}`;$('mWin').textContent=`${signals.filter(isTp2).length} / ${signals.filter(s=>isTp1(s)&&!isTp2(s)).length}`;$('mLoss').textContent=`${signals.filter(isLoss).length} / ${signals.filter(isWeak).length}`}
function render(){metrics();const rows=filtered();$('list').innerHTML=rows.map(s=>`<div class="signal"><div class="head"><div><a class="symbol" href="${url(s.symbol)}" target="_blank">${s.symbol||'-'}</a><span class="id">${s.id||'-'}</span></div><div style="text-align:right"><span class="tag ${s.side==='LONG'?'long':'short'}">${s.side||'-'}</span><br><span class="tag ${bucketClass(s.bucket)}" style="margin-top:5px">${(s.bucket||'-').replace('_',' ')}</span></div></div><div class="kv"><div><span>Status</span><b><span class="tag ${statusClass(s)}">${s.status||'-'}</span></b></div><div><span>Playbook</span><b>${s.playbook||'-'}</b></div><div><span>Entry / SL</span><b>${fmt(s.entry,8)} / ${fmt(s.sl,8)}</b></div><div><span>TP1 / TP2</span><b>${fmt(s.tp1,8)} / ${s.tp2Enabled?fmt(s.tp2,8):'OFF'}</b></div><div><span>TP1 prob</span><b>${pct(s.tp1Prob)}</b></div><div><span>EV / Edge</span><b>${fmt(s.ev,2)}R / ${s.edgeScore||0}</b></div><div><span>MFE / MAE</span><b>${fmt(s.mfe,1)} / ${fmt(s.mae,1)}</b></div><div><span>Market</span><b>${s.marketRegime||'-'}</b></div></div><div class="notes">Signal: ${dt(s.signalTime)} · Entry: ${dt(s.entryHitTime)} · TP1: ${dt(s.tp1HitTime)} · Close: ${dt(s.closeTime)}<br>${(s.reasons||[]).slice(0,4).join(' · ')}</div></div>`).join('')||'<div class="empty">Không có signal.</div>'}
document.addEventListener('DOMContentLoaded',()=>{loadCfg();$('settingsToggle').onclick=()=>$('settings').classList.toggle('hide');$('saveBtn').onclick=saveCfg;$('loginBtn').onclick=()=>login().catch(e=>status(e.message));$('refreshBtn').onclick=()=>loadCloud().catch(e=>status(e.message));$('jsonFile').onchange=e=>e.target.files[0]&&importFile(e.target.files[0]);$('side').onchange=render;$('search').oninput=render;$('tabs').onclick=e=>{if(e.target.matches('button[data-tab]')){[...$('tabs').querySelectorAll('button')].forEach(b=>b.classList.remove('active'));e.target.classList.add('active');tab=e.target.dataset.tab;render()}};render()});
</script>
</body>
</html>
